<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kubernetes — REAL PRODUCTION ENVIRONMENT</title>
  <style>
    html,body { height:100%; margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Arial; background:#05060a; color:#e6eef8; }
    #container{ width:100%; height:100vh; overflow:hidden; position:relative; }

    /* HUD */
    .hud{
      position:absolute; left:20px; top:20px; z-index:10; backdrop-filter: blur(6px) saturate(1.1);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:12px; padding:12px 16px; box-shadow:0 6px 30px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.04);
    }
    .hud h1{ margin:0; font-size:14px; letter-spacing:0.12em; color:#9fe3ff }
    .hud p{ margin:6px 0 0 0; font-size:12px; opacity:0.9 }

    /* Warning ribbon */
    .ribbon{
      position:absolute; right:20px; top:20px; z-index:11; transform:skewX(-12deg);
      background: linear-gradient(90deg,#ff6b6b,#ffb26b); color:#111; font-weight:700;
      padding:10px 22px; border-radius:6px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      font-family:monospace; letter-spacing:0.06em;
    }

    /* Big center overlay text */
    .tagline{
      position:absolute; left:50%; top:82%; transform:translateX(-50%); z-index:12;
      text-align:center; pointer-events:none; mix-blend-mode:screen;
    }
    .tagline .big{
      font-size:34px; font-weight:800; text-transform:uppercase; letter-spacing:0.16em;
      -webkit-text-stroke: 1px rgba(0,0,0,0.25);
      text-shadow: 0 6px 30px rgba(0,0,0,0.6);
      color:transparent; background:linear-gradient(90deg,#9fe3ff,#7effc7,#ffd97e);
      -webkit-background-clip:text; background-clip:text;
      filter:drop-shadow(0 6px 18px rgba(0,0,0,0.45));
    }
    .tagline .small{ margin-top:8px; font-size:13px; opacity:0.9; color:#dfeefe }

    /* Footer */
    .footer{ position:absolute; left:20px; bottom:18px; color:#9fbcd7; font-size:12px; opacity:0.9 }

    /* Mobile tweaks */
    @media (max-width:700px){ .tagline .big{ font-size:22px } .hud{ display:none } }

  </style>
</head>
<body>
  <div id="container">
    <div class="hud">
      <h1>KUBERNETES</h1>
      <p>Cluster: prod-cluster-01 · Nodes: 5 · Pods: 247</p>
    </div>
    <div class="ribbon">⚠️ THIS IS REAL PRODUCTION ENVIRONMENT</div>

    <div class="tagline">
      <div class="big">THIS IS REAL PRODUCTION ENVIRONMENT</div>
      <div class="small">Handle with care — live traffic running</div>
    </div>

    <div class="footer">Interactive 3D demo — drag to orbit, scroll to zoom</div>
  </div>

  <!-- three.js + OrbitControls from CDN -->
  <script src="https://unpkg.com/three@0.153.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.153.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Basic scene setup
    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05060a, 0.035);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 1000);
    camera.position.set(0, 12, 32);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.07;
    controls.minDistance = 8; controls.maxDistance = 80;

    // lights
    const hemi = new THREE.HemisphereLight(0x9fbddf, 0x0b1220, 0.7);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(10,20,10);
    scene.add(dir);

    // Particle field (for ambient movement)
    const particleCount = 800;
    const particlesGeom = new THREE.BufferGeometry();
    const pos = new Float32Array(particleCount * 3);
    for(let i=0;i<particleCount;i++){
      pos[i*3+0] = (Math.random()-0.5) * 120;
      pos[i*3+1] = (Math.random()-0.5) * 40;
      pos[i*3+2] = (Math.random()-0.5) * 120;
    }
    particlesGeom.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const particlesMat = new THREE.PointsMaterial({ size:0.45, transparent:true, opacity:0.8 });
    const particleSystem = new THREE.Points(particlesGeom, particlesMat);
    scene.add(particleSystem);

    // Create a stylized "k8s wheel" using extruded hexagon spokes
    // Base hexagon shape
    function createK8sWheel(){
      const group = new THREE.Group();

      // central core
      const coreGeo = new THREE.CylinderGeometry(2.6,2.6,1.2,32);
      const coreMat = new THREE.MeshPhysicalMaterial({ metalness:0.9, roughness:0.25, clearcoat:0.8, color:0x073b4c, emissive:0x073b4c, emissiveIntensity:0.1 });
      const core = new THREE.Mesh(coreGeo, coreMat);
      core.rotation.x = Math.PI/2;
      group.add(core);

      // create 6 spokes (like a wheel) — hexagonal theme
      const spokeGeom = new THREE.BoxGeometry(0.9, 7.5, 0.7);
      const spokeMat = new THREE.MeshStandardMaterial({ color:0x3bd9ff, metalness:0.6, roughness:0.2 });

      for(let i=0;i<6;i++){
        const s = new THREE.Mesh(spokeGeom, spokeMat);
        s.position.y = 3.8;
        s.rotation.z = (Math.PI/6) + i * (Math.PI/3);
        s.position.x = Math.cos(i * (Math.PI/3)) * 0.6;
        s.position.z = Math.sin(i * (Math.PI/3)) * 0.6;
        group.add(s);
      }

      // outer ring
      const ringGeo = new THREE.TorusGeometry(9.0, 0.9, 30, 120);
      const ringMat = new THREE.MeshPhysicalMaterial({ color:0x084a63, metalness:0.9, roughness:0.2, clearcoat:0.6 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI/2;
      group.add(ring);

      // add glowing rim using shader-like sprite (billboard)
      const spriteMat = new THREE.SpriteMaterial({
        map: makeGlowTexture(),
        blending: THREE.AdditiveBlending, opacity:0.35, depthWrite:false
      });
      const glow = new THREE.Sprite(spriteMat);
      glow.scale.set(30,30,1);
      group.add(glow);

      return group;
    }

    function makeGlowTexture(){
      const size = 512;
      const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      grad.addColorStop(0, 'rgba(150,255,255,0.95)');
      grad.addColorStop(0.35, 'rgba(120,220,255,0.35)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad; ctx.fillRect(0,0,size,size);
      const tex = new THREE.CanvasTexture(canvas); return tex;
    }

    const wheel = createK8sWheel();
    wheel.position.set(0,0,0);
    scene.add(wheel);

    // Floating labels: show "PROD" badge in 3D
    const createBadge = (text)=>{
      const canvas = document.createElement('canvas'); canvas.width=512; canvas.height=256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(8,12,18,0.0)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.font = 'bold 96px monospace'; ctx.textAlign='center'; ctx.fillStyle = '#ffb26b';
      ctx.fillText(text, canvas.width/2, canvas.height/2 + 30);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map:tex, transparent:true });
      const spr = new THREE.Sprite(mat); spr.scale.set(6,3,1);
      return spr;
    }
    const prodBadge = createBadge('PROD'); prodBadge.position.set(0,7.6,0); scene.add(prodBadge);

    // subtle ground
    const groundGeo = new THREE.CircleGeometry(55, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color:0x04141a, roughness:1, metalness:0 });
    const ground = new THREE.Mesh(groundGeo, groundMat); ground.rotation.x = -Math.PI/2; ground.position.y = -6.2; scene.add(ground);

    // cluster nodes — little spheres orbiting the wheel
    const nodesGroup = new THREE.Group();
    for(let i=0;i<8;i++){
      const nGeo = new THREE.SphereGeometry(0.65,16,16);
      const nMat = new THREE.MeshStandardMaterial({ color:0x7effc7, emissive:0x1c6f5f, metalness:0.6, roughness:0.3 });
      const node = new THREE.Mesh(nGeo,nMat);
      const angle = i*(Math.PI*2/8);
      node.userData = {angle, radius: 15 + (i%2?2:-2), speed:0.002 + Math.random()*0.004 };
      node.position.set(Math.cos(angle)*node.userData.radius, (Math.random()-0.5)*2.8, Math.sin(angle)*node.userData.radius);
      nodesGroup.add(node);
    }
    scene.add(nodesGroup);

    // responsive
    window.addEventListener('resize', ()=>{
      camera.aspect = container.clientWidth/container.clientHeight; camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // animation loop
    let t=0;
    function animate(){
      t += 0.01;
      // particles gentle drift
      particleSystem.rotation.y = t * 0.03;

      // wheel slow spin
      wheel.rotation.y += 0.0025;
      wheel.rotation.x = Math.sin(t*0.1) * 0.04;

      // nodes orbit
      nodesGroup.children.forEach(n=>{
        n.userData.angle += n.userData.speed;
        n.position.x = Math.cos(n.userData.angle) * n.userData.radius;
        n.position.z = Math.sin(n.userData.angle) * n.userData.radius;
        n.position.y = Math.sin(t*0.6 + n.userData.angle*2) * 1.8;
      });

      // breathing badge
      prodBadge.scale.x = prodBadge.scale.y = 5 + Math.sin(t*1.6)*0.12;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // tiny easter-keys to flash ribbon
    window.addEventListener('keydown', (e)=>{
      if(e.key === '!' || e.key === '1'){
        const ribbon = document.querySelector('.ribbon');
        ribbon.style.transition = 'transform 0.25s ease, box-shadow 0.25s ease';
        ribbon.style.transform = 'skewX(-12deg) scale(1.04)';
        setTimeout(()=> ribbon.style.transform = 'skewX(-12deg) scale(1)', 250);
      }
    });

    // friendly hint if WebGL not available
    if(!renderer.capabilities || !renderer.context){
      const d = document.createElement('div'); d.style.padding='20px'; d.style.color='white'; d.innerHTML='Your browser does not support WebGL — try a modern browser like Chrome or Firefox.';
      container.appendChild(d);
    }
  </script>
</body>
</html>
