<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kubernetes Playground — 3D Animation</title>
<style>
:root{
  --bg1:#0f1b2a;
  --bg2:#1b4d8a;
  --bg3:#1ec1b6;
  --fg:#eaf6ff;
  --accent1:#6be3ff;
  --accent2:#4f8cff;
  --accent3:#9b5cff;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at 30% 30%, rgba(79,140,255,0.25), transparent 40%),
              radial-gradient(circle at 70% 70%, rgba(30,193,182,0.25), transparent 40%),
              linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
  font-family: 'Inter', sans-serif;
  color: var(--fg);
  overflow:hidden;
}

.stage3d{
  position:relative;
  width:90vw;
  max-width:1200px;
  height:80vh;
  perspective:1200px;
}

.cluster{
  width:100%;
  height:100%;
  transform-style: preserve-3d;
  animation: rotateCluster 60s linear infinite;
  position: relative;
}

@keyframes rotateCluster{
  0% {transform: rotateY(0deg) rotateX(10deg);}
  100% {transform: rotateY(360deg) rotateX(10deg);}
}

.node{
  width:120px;
  height:120px;
  background: rgba(255,255,255,0.08);
  border: 2px solid var(--accent2);
  border-radius:16px;
  position:absolute;
  top:50%;
  left:50%;
  transform-style: preserve-3d;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow: 0 0 30px rgba(79,140,255,0.5);
  animation: floatNode 6s ease-in-out infinite alternate;
}

@keyframes floatNode{
  0% {transform: translate3d(-50%,-50%,0) translateY(0px);}
  100% {transform: translate3d(-50%,-50%,0) translateY(-20px);}
}

.pod{
  width:40px;
  height:40px;
  background: linear-gradient(135deg, var(--accent1), var(--accent3));
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform-style: preserve-3d;
  box-shadow:0 0 15px rgba(255,255,255,0.7);
  animation: orbitPod 10s linear infinite;
}

@keyframes orbitPod{
  0%{transform: rotateZ(0deg) translateX(60px) rotateZ(0deg);}
  100%{transform: rotateZ(360deg) translateX(60px) rotateZ(-360deg);}
}

/* 3D particles background */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  animation: floatParticle 20s linear infinite;
}

@keyframes floatParticle{
  0%{transform: translate3d(0,0,0);}
  100%{transform: translate3d(200px,-200px,-500px);}
}

.header3d{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  z-index:10;
}

.header3d h1{
  font-size:3rem;
  background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:8px;
}

.header3d p{
  font-size:1.2rem;
  opacity:0.9;
}

/* Button */
.cta3d{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background: linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));
  color:#06223b;
  font-weight:600;
  padding:12px 24px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  box-shadow: 0 6px 18px rgba(107,227,255,0.6);
  transition: transform 0.2s ease;
}

.cta3d:hover{transform:translateY(-2px);}

/* Animate multiple pods orbiting nodes */
.node:nth-child(1) .pod:nth-child(1){animation-delay:0s;}
.node:nth-child(1) .pod:nth-child(2){animation-delay:2s;}
.node:nth-child(1) .pod:nth-child(3){animation-delay:4s;}
.node:nth-child(2) .pod:nth-child(1){animation-delay:1s;}
.node:nth-child(2) .pod:nth-child(2){animation-delay:3s;}
.node:nth-child(2) .pod:nth-child(3){animation-delay:5s;}

</style>
</head>
<body>
  <div class="stage3d">
    <div class="header3d">
      <h1>UAT Kubernetes 3D Playground</h1>
      <p>Explore a floating cluster with nodes and pods—everything animated in your browser!</p>
    </div>

    <div class="cluster">
      <!-- Node 1 -->
      <div class="node" style="transform: translate3d(-150px,-50px,50px);">
        <div class="pod"></div>
        <div class="pod"></div>
        <div class="pod"></div>
      </div>
      <!-- Node 2 -->
      <div class="node" style="transform: translate3d(120px,50px,-80px);">
        <div class="pod"></div>
        <div class="pod"></div>
        <div class="pod"></div>
      </div>
      <!-- Node 3 -->
      <div class="node" style="transform: translate3d(0px,120px,100px);">
        <div class="pod"></div>
        <div class="pod"></div>
        <div class="pod"></div>
      </div>

      <!-- Random floating particles -->
      <div class="particle" style="top:20px;left:40px;animation-duration:18s;"></div>
      <div class="particle" style="top:80px;left:120px;animation-duration:22s;"></div>
      <div class="particle" style="top:150px;left:200px;animation-duration:25s;"></div>
      <div class="particle" style="top:200px;left:300px;animation-duration:20s;"></div>
      <div class="particle" style="top:50px;left:250px;animation-duration:28s;"></div>
    </div>

    <button class="cta3d">Start Your Local Playground</button>
  </div>
</body>
</html>
