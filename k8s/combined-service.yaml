# kubectl apply -f combined-service.yaml
# kubectl get svc
apiVersion: v1
kind: Service
metadata:
  name: apache-uat-svc
spec:
  selector:
    app: apache-uat
  type: NodePort
  ports:
    - protocol: TCP
      port: 80          # inside cluster
      targetPort: 80    # container port
      nodePort: 30001   # host port
---
apiVersion: v1
kind: Service
metadata:
  name: apache-qatest-svc
spec:
  selector:
    app: apache-qatest
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30002
---
apiVersion: v1
kind: Service
metadata:
  name: apache-production-svc
spec:
  selector:
    app: apache-production
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30003
