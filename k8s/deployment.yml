apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-uat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache-uat
  template:
    metadata:
      labels:
        app: apache-uat
    spec:
      containers:
      - name: apache
        image: nirmal46789/alpine-kubepractice-app:uat-16
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-uat-svc
spec:
  selector:
    app: apache-uat
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30001







